syntax = "proto3";

package order;

option go_package = "github.com/sologenic/com-fs-order-model;order";

import "google/protobuf/timestamp.proto";
import "util.proto";
import "broker.proto";
import "sologenic/com-fs-utils-lib/models/metadata/metadata.proto";


// Order key: OrderID-SmartContractAddr-Network (1 entry per order)
// Order history key(id): numeric ID auto-generated by datastore (M entries per order) 
message Order {
    metadata.Network Network = 1;
    string SmartContractAddr = 2;
    OrderInstruction Instruction = 3; // Snapshot of the order in the smart contract
    google.protobuf.Timestamp CreatedAt = 4;
    google.protobuf.Timestamp UpdatedAt = 5;
    TransactionType TransactionType = 6;
    string TXID = 7; // Unique Key in the datastore
    int64 GasFee = 8;
    optional double GasFeeUSD = 9;
    google.protobuf.Timestamp DetectedAt = 10;
    int64 Height = 11;

    InternalOrderState InternalOrderState = 12;
    BrokerOrderDetails BrokerOrderDetails = 13; // Matches data on SmartContractAddr, orderdetails.OrderID and network

    // Bookkeeping: did we process this event from broker smart contract order log?
    optional ProcessInfo ProcessInfo = 14;

    optional string InstanceID = 15; // ID used by logs to identify the instance where the log was created/ processed

    google.protobuf.Timestamp BlockTime = 16;
    int64 Sequence = 17; // SequenceID
}

// Execution type(action) of the transaction against the smart contract
enum TransactionType {
    NOT_USED_TRANSACTION_TYPE = 0;
    PURCHASE = 1;
    SELL = 2;
    REQUEST_ORDER_CANCEL = 3;
    EXECUTE_ORDER = 4;
    PAY_ORDER = 5;
    REQUEST_REATTESTATION = 6;
}

// Same structure as Order in the Smart Contract
message OrderInstruction {
    int64 OrderID = 1; // Google datastore supports int64, not uint64, which is the used in the smart contract
    string Creator = 2; // Sender in message from Coreum
    string Denom = 3;
    int64 Amount = 4;
    int32 AmountExp = 5;

    int64 LimitPrice = 6;
    int32 LimitPriceExp = 7;
    bool FillOrKill = 8; // true: order must be filled immediately or canceled, false: order can be partially filled, by default false
    optional string ExpiresAt = 9; // In ISO-8601 Zulu format (e.g., "2024-02-29T23:59:59Z")
    OrderDetailType OrderDetailType = 10;

    optional Hold Hold = 11;
    Coin FundsSent = 12;
    OrderType OrderType = 13;
    OrderState OrderState = 14;
    optional PaymentState PaymentState = 15;
    optional int64 AmountExecuted = 16;
    optional int32 AmountExecutedExp = 17;
    optional int64 UsedFundsAmount = 18;
    optional int32 UsedFundsAmountExp = 19;
    optional int64 Costs = 20;
    optional int32 CostsExp = 21;
}

message Orders {
    repeated Order Orders = 1;
    optional int32 Offset = 2;
}

message Hold {
    string Denom = 1;
    int64 Amount = 2;
    int32 AmountExp = 3;
}

message Coin {
    string Denom = 1;
    int64 Amount = 2;
}

enum OrderStateType {
    NOT_USED_ORDER_STATE_TYPE = 0;
    OPEN = 1;
    PLACED = 2;
    PARTIALLY_EXECUTED = 3;
    EXECUTED = 4;
    CANCELLATION_REQUESTED = 5;
    CANCELLED = 6;
}

enum OrderCancelledBy {
    NOT_USED_ORDER_CANCEL_BY = 0;
    SMART_CONTRACT_OWNER = 1;
    USER = 2;
    BROKER_ORACLE = 3;
}

message OrderState {
    OrderStateType OrderStateType = 1;
    optional OrderCancelledBy OrderCancelledBy  = 2;
}

enum PaymentState {
    NOT_USED_PAYMENT_STATE = 0;
    NOT_PAID = 1;
    PAID = 2;
}

enum InternalOrderState {
    NOT_USED_INTERNAL_ORDER_STATE = 0;
    
    // Initial state: Order is just created in the smart contract
    SMART_CONTRACT_NEW_ORDER_CREATED = 1; // initial status when the order(BUY/SELL) is just created in the smart contract, OrderState in SC: `open``
    
    // Order place states
    BROKER_ORDER_PRE_SUBMITTED = 2; // order is pre-submitted to the broker for further processing
    BROKER_ORDER_SUBMITTED = 3; // order is submitted to the broker for further processing
    
    BROKER_ORDER_ACCEPTED = 4; // (afterhours) order has been received by the broker, but hasn’t yet been routed to the execution venue, OrderState in Broker: `accepted`
    BROKER_ORDER_PENDING_NEW = 5; // order has been routed to the exchange and it hasn't yet been confirmed by the exchange, OrderState in Broker: `pending_new`
    BROKER_ORDER_NEW = 6; // order has been confirmed by the exchange and is active, OrderState in Broker: `new`
    
    SMART_CONTRACT_ORDER_PLACED = 7; // order has been placed in the smart contract, OrderState in SC: `placed`

    BROKER_ORDER_PARTIALLY_FILLED = 8; // order has been partially filled, OrderState in Broker: `partially_filled`
    SMART_CONTRACT_ORDER_PARTIALLY_FILLED_SUBMITTED = 9; // order has been partially executed in the smart contract, OrderState in SC: `partially_executed`

    BROKER_ORDER_FILLED = 10; // order has been completely filled, OrderState in Broker: `filled`
    SMART_CONTRACT_ORDER_EXECUTED = 11; // order has been executed in the smart contract, OrderState in SC: `executed`

    BROKER_ORDER_PRE_CANCEL_REQUESTED = 12;
    BROKER_ORDER_CANCEL_REQUESTED = 13; // order cancellation request has been submitted to the broker

    BROKER_ORDER_CANCELED = 14; // order has been canceled by the broker, OrderState in Broker: `canceled`
    BROKER_ORDER_REFUSED = 15; // order sent to the broker, but the broker refused to accept it
    BROKER_ORDER_EXPIRED = 16; // order has expired, OrderState in Broker: `expired`
    
    SMART_CONTRACT_PRE_ORDER_CANCELLED = 17;
    SMART_CONTRACT_ORDER_CANCELLED = 18; // order has been cancelled in the smart contract, OrderState in SC: `cancelled`

    PROCESS_FINISHED = 19; // order has been processed and finished
    
    // Alternative scenarios
    SMART_CONTRACT_CANCEL_ORDER_REQUESTED = 20; // order cancellation request has been submitted to the smart contract, OrderState in SC: `cancellation_requested`
}

enum OrderDetailType {
    NOT_USED_ORDER_DETAIL_TYPE = 0;
    ORDER_DETAIL_LIMIT = 1;
    ORDER_DETAIL_MARKET = 2; // Ignores LimitPrice, executes at market price
    ORDER_DETAIL_STOP_LOSS = 3; // Uses LimitPrice as the stop loss threshold
}
