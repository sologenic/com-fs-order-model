syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

enum OrderType {
    NOT_USED_ORDER_TYPE = 0;
    ORDER_TYPE_PURCHASE = 1; // Avoid naming conflicts with PURCHASE in the action enum
    ORDER_TYPE_SELL = 2;
}

message Processed {
    bool Processed = 1;
    google.protobuf.Timestamp ProcessedAt = 2;
}