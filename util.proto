syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

enum OrderType {
    //Changed not used to NOT_APPLICABLE_ORDER_TYPE to avoid naming conflicts with PURCHASE in the action enum
    NOT_APPLICABLE_ORDER_TYPE = 0;
    ORDER_TYPE_PURCHASE = 1; // Avoid naming conflicts with PURCHASE in the action enum
    ORDER_TYPE_SELL = 2;
}

enum TimeInForce {
    NOT_USED_TIME_IN_FORCE = 0;
    DAY = 1;
    GOOD_TIL_CANCELED = 2; // GTC
    AT_THE_OPENING = 3; // OPG
    AT_THE_CLOSE = 4; // CLS
    IMMEDIATE_OR_CANCEL = 5; // IOC
    FILL_OR_KILL = 6; // FOK
    GOOD_TIL_TIME = 7; // GTT
}

message ProcessInfo {
    ProcessState ProcessState = 1;
    google.protobuf.Timestamp ProcessedAt = 2;
}

enum ProcessState {
    NOT_USED_PROCESS_STATE = 0;
    PROCESS_STATE_OPEN = 1;
    PROCESS_STATE_LOCKED = 2;
    PROCESS_STATE_FAILED = 3;
    PROCESS_STATE_PROCESSED = 4;
}

message LockLogRecord {
    string Key = 1;
    repeated ProcessState MustHaveState = 2;
    ProcessState TargetState = 3;
}

// The `Key` field represents the datastore key for the `Order` message.
// The `KeyPrefix` field is used to create a key for broker or smart contract logs (prefix + key = key for logs).
// The `IsNew` field identifies if the record linked to the key is new. This is helpful for recovery because
// both the rescanner and the recovery service might pick up the same record. When creating log records, if `IsNew` is true, the Key is sent
// through the channel for processing. Otherwise, it isn't sent, as an existing key signals the recovery service will handle it.
message Key {
    string Key = 1;
    optional string KeyPrefix = 2;
    optional bool IsNew = 3;
}

message InstanceID {
    string InstanceID = 1;
}