syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

enum OrderType {
    NOT_USED_ORDER_TYPE = 0;
    ORDER_TYPE_PURCHASE = 1; // Avoid naming conflicts with PURCHASE in the action enum
    ORDER_TYPE_SELL = 2;
}

message Processed {
    ProcessedState ProcessedState = 1;
    google.protobuf.Timestamp ProcessedAt = 2;
}

enum ProcessedState {
    NOT_USED_PROCESSED_STATE = 0;
    PROCESSED_STATE_OPEN = 1;
    PROCESSED_STATE_LOCKED = 2;
    PROCESSED_STATE_FAILED = 3;
    PROCESSED_STATE_PROCESSED = 4;
}