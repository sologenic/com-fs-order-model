syntax = "proto3";

package order;

import "google/protobuf/empty.proto";
import "order.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

// Broker smart contract Trade log
service BrokerSmartContractService {
    rpc CreateBrokerSmartContractOrder(Order) returns (google.protobuf.Empty) {}
  //  rpc Get(Filter) returns (Records) {}
    rpc UpdateBrokerSmartContractOrder(Order) returns (google.protobuf.Empty) {} // Broker smart contract log line processed into order
}

