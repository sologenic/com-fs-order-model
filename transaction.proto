syntax = "proto3";

package transaction;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sologenic/com-fs-transaction-model;transaction";

message Transaction {
    string TXID = 1; // Unique Key in the datastore
    int64 Height = 2;
    string Network = 3;
    int64 CreatedAt = 4; 
    // int64 UpdatedAt = 5; // TODO: consider: do we update TX record, otherwise no need for this field
    // int64 DetectedAt = 6;
    string AssetKey = 5;

    string SmartContractAddr = 6;
    TransactionType TransactionType = 7;
    string Sender = 8;

    // Store the snapshot of the order at the time of the transaction
    OrderBase OrderDetail = 9; 

    // Attenstation Details (optional)
    optional Attestation Attestation = 10;

    // TBD: Add more fields as needed such as the fee, etc.
    int64 FeeUSD = 11;
}

message Transactions {
    repeated Transaction Transactions = 1;
    optional int32 Offset = 2;
}

// Execution type(action) of the transaction against the smart contract
enum TransactionType {
    NOT_USED_TRANSACTION_TYPE = 0;
    PURCHASE = 1;
    SELL = 2;
    REQUEST_ORDER_CANCEL = 3;
    EXECUTE_ORDER = 4;
    PAY_ORDER = 5;
    REQUEST_REATTESTATION = 6;
}

// Same structure as Order in the Smart Contract
message OrderBase {
    int64 OrderID = 1; // Google datastore supports int64, not uint64, which is the used in the smart contract
    string Creator = 2;
    string Denom = 3;
    int64 Amount = 4;
    int32 AmountExp = 5;
    Instruction Instruction = 6;
    optional Hold Hold = 7;
    Coin FundsSent = 8;
    OrderType OrderType = 9;
    OrderState OrderState = 10;
    optional PaymentState PaymentState = 11;
    optional int64 AmountExecuted = 12;
    optional int32 AmountExecutedExp = 13;
    optional int64 UsedFundsAmount = 14;
    optional int32 UsedFundsAmountExp = 15;
    optional int64 Costs = 16;
    optional int32 CostsExp = 17;
}

message Order {
    // Key combination: Network_SmartContractAddr_OrderID
    string Network = 1;
    string SmartContractAddr = 2;
    string AssetKey = 3;
    OrderBase LatestSmartContractOrderDetail = 4; // Latest snapshot of the order in the smart contract
    int64 CreatedAt = 5;

    // Additional fields to keep track of the order status in the broker and smart contract
    google.protobuf.Timestamp UpdatedAt = 6;
    
    // Internal Order state
    InternalOrderState InternalOrderState = 7;

    AlpacaOrderDetails OrderDetails = 8;
    bool IsPartialFill = 9; // update in trade listener
    OrderInstruction OrderInstruction = 10; // parsed instruction to be forwarded to the broker
}

message AlpacaOrderDetails {
    string AlpacaOrderID = 1; // order ID in Alpaca, auto generated
    string ClientOrderID = 2; // tag by Sologenic, format is datastore key for Order + "_" + timestamp in nanoseconds
    google.protobuf.Timestamp SubmittedAt = 3;
    optional google.protobuf.Timestamp FilledAt = 4;
    optional google.protobuf.Timestamp ExpiredAt = 5;
    optional google.protobuf.Timestamp CancelledAt = 6;
    optional google.protobuf.Timestamp FailedAt = 7;
    optional google.protobuf.Timestamp ReplacedAt = 8;
    optional string ReplacedBy = 9; // if order is replaced, store the new order ID here
    optional string Replaces = 10; // opposite of ReplacedBy, store the previous order ID here
    string AssetID = 11;
    string Symbol = 12;
    AssetClass AssetClass = 13;
    optional OrderClass OrderClass = 14;
    
    TradeType TradeType = 15;
    OrderType Side = 16; // TODO: determine - do we need this at this level since its inside OrderBase?
    TimeInForce TimeInForce = 17;
    
    // Notional and Qty are optional as one can be null if the other is present. However, both cannot be null or present at the same time.
    optional Decimal Notional = 18; 
    optional Decimal TotalQty = 19;
    
    Decimal FilledQty = 20; // defaults to 0, updated as previous `FilledQty` + `PartialQty`
    optional Decimal FilledAvgPrice = 21;
    optional Decimal LimitPrice = 22;
    optional Decimal StopPrice = 23;
    optional Decimal TrailPrice = 24;
    optional Decimal TrailPercent = 25;
    optional Decimal HWM = 26; // High Water Mark, used for trailing stop orders
    bool ExtendedHours = 27; // defaults to false
    repeated Order Legs = 28;
    optional Decimal TotalPosition = 29;
    
    // Represents the price of the order processed at the time of partial fill. For example, if a 3 step partial fill occurs for an order at prices $1, $1.1 and $0.9,
    // the `PartialPrice` will be $1, $1.1 and $0.9 respectively. The average of these prices will be the `FilledAvgPrice`.
    optional Decimal PartialPrice = 30; 
    // Represents the partial order processed at the time of partial fill. For example, if a order for 10 shares is partially filled with 5, 3 and 2 shares,
    // the `PartialQty` will be 5, 3 and 2 respectively.
    optional Decimal PartialQty = 31; // partial qty of the order
    google.protobuf.Timestamp CreatedAt = 32;
    InternalOrderState Status = 33; // status of the order in Alpaca
}

// Represents a fixed-point decimal number.
// Use `value` and `exp` with `decimal.New()` from `github.com/shopspring/decimal` to create a decimal.Decimal object.
// This ensures precise handling without converting to floats or doubles.
// The number is represented as: Number = value * 10 ^ exp
message Decimal {
    int64 Value = 1;
    int32 Exp = 2;
}

message AlpacaOrderDetailsList {
    repeated AlpacaOrderDetails AlpacaOrderDetailsList = 1;
}

enum OrderClass {
    NOT_USED_ORDER_CLASS = 0;
    ORDER_CLASS_SIMPLE = 1;
    ORDER_CLASS_BRACKET = 2;
    ORDER_CLASS_OCO = 3; // One-Cancels-Other
    ORDER_CLASS_OTO = 4; // One-Triggers-Other
}

enum AssetClass {
    NOT_USED_ASSET_CLASS = 0;
    US_EQUITY = 1;
    CRYPTO = 2;
}

enum TimeInForce {
    NOT_USED_TIME_IN_FORCE = 0;
    DAY = 1;
    GTC = 2;

    // TODO: the below types will be implemented in the future
    OPG = 3;
    CLS = 4;
    IOC = 5;
    FOK = 6;
}

enum TradeType {
    NOT_USED_TRADE_TYPE = 0;
    MARKET = 1;
    LIMIT = 2;
    
    // TODO: the below types will be implemented in the future
    STOP = 3;
    STOP_LIMIT = 4;
    OPEN_CLOSE_AUCTION = 5;
    BRACKET = 6;
    OCO = 7; // One-Cancels-Other
    OTO = 8; // One-Triggers-Other
    TRAILING_STOP = 9;
}

message Orders {
    repeated Order Orders = 1;
    optional int32 Offset = 2;
}

message Instruction {
    string LimitPrice = 1;
    string LimitPriceExp = 2;
    string Options = 3; // Base64 encoded JSON string
}

message Hold {
    string Denom = 1;
    int64 Amount = 2;
    int32 AmountExp = 3;
}

message Coin {
    string Denom = 1;
    int64 Amount = 2;
}

enum OrderType {
    NOT_USED_ORDER_TYPE = 0;
    ORDER_TYPE_PURCHASE = 1; // Avoid naming conflicts with PURCHASE in the action enum
    ORDER_TYPE_SELL = 2;
}

enum OrderStateType {
    NOT_USED_ORDER_STATE_TYPE = 0;
    OPEN = 1;
    PLACED = 2;
    PARTIALLY_EXECUTED = 3;
    EXECUTED = 4;
    CANCELLATION_REQUESTED = 5;
    CANCELLED = 6;
}

enum OrderCancelledBy {
    NOT_USED_ORDER_CANCEL_BY = 0;
    SMART_CONTRACT_OWNER = 1;
    USER = 2;
    BROKER_ORACLE = 3;
}

message OrderState {
    OrderStateType OrderStateType = 1;
    optional OrderCancelledBy OrderCancelledBy  = 2;
}

enum PaymentState {
    NOT_USED_PAYMENT_STATE = 0;
    NOT_PAID = 1;
    PAID = 2;
}

enum InternalOrderState {
    NOT_USED_INTERNAL_ORDER_STATE = 0;
    
    // Initial state: Order is just created in the smart contract
    SMART_CONTRACT_NEW_ORDER_CREATED = 1; // initial status when the order(BUY/SELL) is just created in the smart contract, OrderState in SC: `open``
    
    // Order place states
    BROKER_ORDER_SUBMITTED = 2; // order is submitted to the broker for further processing
    BROKER_ORDER_ACCEPTED = 3; //  order has been received by the broker, but hasn’t yet been routed to the execution venue, OrderState in Broker: `accepted`

    BROKER_ORDER_PENDING_NEW = 4; // order has been routed to the exchange and it hasn't yet been confirmed by the exchange, OrderState in Broker: `pending_new`
    BROKER_ORDER_NEW = 5; // order has been confirmed by the exchange and is active, OrderState in Broker: `new`
    
    BROKER_ORACLE_SUBMITTED_UPDATE_ORDER = 6; // broker oracle has submitted an update order request with `placed` or `partially_filled` to the smart contract
    SMART_CONTRACT_ORDER_PLACED = 7; // order has been placed in the smart contract, OrderState in SC: `placed`
    
    // Order cancellation states
    SMART_CONTRACT_CANCEL_ORDER_REQUESTED = 8; // order cancellation request has been submitted to the smart contract, OrderState in SC: `cancellation_requested`
    TX_LISTENER_CANCEL_ORDER_REQUESTED_BEFORE_PLACED = 19; // order cancellation request has been submitted to the smart contract before the order is placed. (directly cancel the order in the smart contract without making a cancel request to the broker)
    BROKER_ORDER_CANCEL_REQUESTED = 9; // order cancellation request has been submitted to the broker
    BROKER_ORDER_CANCELED = 10; // order has been canceled by the broker, OrderState in Broker: `canceled`
    
    // Order execution states
    BROKER_ORDER_PARTIALLY_FILLED = 11; // order has been partially filled, OrderState in Broker: `partially_filled`
    BROKER_ORDER_FILLED = 12; // order has been completely filled, OrderState in Broker: `filled`
    BROKER_ORDER_EXPIRED = 13; // order has expired, OrderState in Broker: `expired`
    
    // Order final states
    BROKER_ORACLE_SUBMITTED_FINAL_UPDATE_ORDER = 14; // broker oracle has submitted a final update order request(final_execution, cancellation) to the smart contract

    SMART_CONTRACT_ORDER_PARTIALLY_EXECUTED = 15; // order has been partially executed in the smart contract, OrderState in SC: `partially_executed`

    // updated by TX-listener
    SMART_CONTRACT_ORDER_EXECUTED = 16; // order has been executed in the smart contract, OrderState in SC: `executed`
    SMART_CONTRACT_ORDER_CANCELLED = 17; // order has been cancelled in the smart contract, OrderState in SC: `cancelled`
    BROKER_ORDER_CREATE_FAILED = 18; // order sent to the broker failed for whatever reason, order is not created in the broker
}

// Instruction parsed from the OrderBase in the smart contract to be forwarded to the broker
message OrderInstruction {
    int64 LimitPrice = 1;
    int32 LimitPriceExp = 2;
    bool FillOrKill = 3; // true: order must be filled immediately or canceled, false: order can be partially filled, by default false
    optional string ExpiresAt = 4; // In ISO-8601 Zulu format (e.g., "2024-02-29T23:59:59Z")
    OrderOptionType OrderOptionType = 5;
}

enum OrderOptionType {
    NOT_USED_ORDER_OPTION_TYPE = 0;
    ORDER_OPTION_LIMIT = 1;
    ORDER_OPTION_MARKET = 2; // Ignores LimitPrice, executes at market price
    ORDER_OPTION_STOP_LOSS = 3; // Uses LimitPrice as the stop loss threshold
}

message Attestation {
    string BrokerQuantity = 1; // Using string to represent Uint128
    string ChainQuantity = 2; // Using string to represent Uint128
    // Note: for the below fields, use int64 instead of uint64 as uint64 not supported in Google Datastore 
    int64 BlockHeight = 3;
    int64 Timestamp = 4;
    int64 ReattestationBlockHeight = 5;
}
