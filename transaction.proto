syntax = "proto3";

package transaction;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sologenic/com-fs-transaction-model;transaction";

message Transaction {
    string TXID = 1; // Unique Key in the datastore
    int64 Height = 2;
    string Network = 3;
    int64 CreatedAt = 4; 
    // int64 UpdatedAt = 5; // TODO: consider: do we update TX record, otherwise no need for this field
    // int64 DetectedAt = 6;
    string AssetKey = 5;

    string SmartContractAddr = 6;
    TransactionType TransactionType = 7;
    string Sender = 8;

    // Store the snapshot of the order at the time of the transaction
    OrderBase OrderDetail = 9; 

    // Attenstation Details (optional)
    optional Attestation Attestation = 10;

    int64 FeeUSD = 11;
}

message Transactions {
    repeated Transaction Transactions = 1;
    optional int32 Offset = 2;
}

// Execution type(action) of the transaction against the smart contract
enum TransactionType {
    NOT_USED_TRANSACTION_TYPE = 0;
    PURCHASE = 1;
    SELL = 2;
    REQUEST_ORDER_CANCEL = 3;
    EXECUTE_ORDER = 4;
    PAY_ORDER = 5;
    REQUEST_REATTESTATION = 6;
}

// Same structure as Order in the Smart Contract
message OrderBase {
    int64 OrderID = 1; // Google datastore supports int64, not uint64, which is the used in the smart contract
    string Creator = 2;
    string Denom = 3;
    int64 Amount = 4;
    int32 AmountExp = 5;
    Instruction Instruction = 6;
    optional Hold Hold = 7;
    Coin FundsSent = 8;
    OrderType OrderType = 9;
    OrderState OrderState = 10;
    optional PaymentState PaymentState = 11;
    optional int64 AmountExecuted = 12;
    optional int32 AmountExecutedExp = 13;
    optional int64 UsedFundsAmount = 14;
    optional int32 UsedFundsAmountExp = 15;
    optional int64 Costs = 16;
    optional int32 CostsExp = 17;
}

message Order {
    // Key combination: Network_SmartContractAddr_OrderID
    string Network = 1;
    string SmartContractAddr = 2;
    string AssetKey = 3;
    OrderBase OrderDetail = 4;
    int64 CreatedAt = 5;
    // Additional fields to keep track of the order status in the broker and smart contract
    google.protobuf.Timestamp UpdatedAt = 6;
    
    // Internal Order state
    InternalOrderState InternalOrderState = 7;

    // TODO: Add more fields as needed such as the broker order ID, placed timestamp, etc.
}

message Orders {
    repeated Order Orders = 1;
    optional int32 Offset = 2;
}

message Instruction {
    string LimitPrice = 1;
    string LimitPriceExp = 2;
    string Options = 3; // Base64 encoded JSON string
}

message Hold {
    string Denom = 1;
    int64 Amount = 2;
    int32 AmountExp = 3;
}

message Coin {
    string Denom = 1;
    int64 Amount = 2;
}

enum OrderType {
    NOT_USED_ORDER_TYPE = 0;
    ORDER_TYPE_PURCHASE = 1; // Avoid nmaing conflicts with PURCHASE in the action enum
    ORDER_TYPE_SELL = 2;
}

enum OrderStateType {
    NOT_USED_ORDER_STATE_TYPE = 0;
    OPEN = 1;
    PLACED = 2;
    PARTIALLY_EXECUTED = 3;
    EXECUTED = 4;
    CANCELLATION_REQUESTED = 5;
    CANCELLED = 6;
}

enum OrderCancelledBy {
    NOT_USED_ORDER_CANCEL_BY = 0;
    SMART_CONTRACT_OWNER = 1;
    USER = 2;
    BROKER_ORACLE = 3;
}

message OrderState {
    OrderStateType OrderStateType = 1;
    optional OrderCancelledBy OrderCancelledBy  = 2;
}

enum PaymentState {
    NOT_USED_PAYMENT_STATE = 0;
    NOT_PAID = 1;
    PAID = 2;
}

enum InternalOrderState {
    NOT_USED_INTERNAL_ORDER_STATE = 0;
    
    // Initial state: Order is just created in the smart contract
    SMART_CONTRACT_NEW_ORDER_CREATED = 1; // initial status when the order(BUY/SELL) is just created in the smart contract, OS in SC: `open``
    
    // Order place states
    BROKER_ORDER_SUBMITTED = 2; // order is submitted to the broker for further processing
    BROKER_ORDER_ACCEPTED = 3; //  order has been received by the broker, but hasn’t yet been routed to the execution venue, OS in Broker: `accepted`

    BROKER_ORDER_PENDING_NEW = 4; // order has been routed to the exchange and it hasn't yet been confirmed by the exchange, OS in Broker: `pending_new`
    BROKER_ORDER_NEW = 5; // order has been confirmed by the exchange and is active, OS in Broker: `new`
    
    BROKER_ORACLE_SUBMITTED_UPDATE_ORDER_PLACED = 6; // broker oracle has submitted an update order request with `placed` status to the smart contract 
    SMART_CONTRACT_ORDER_PLACED = 7; // order has been placed in the smart contract, OS in SC: `placed`
    
    // Order cancellation states
    SMART_CONTRACT_CANCEL_ORDER_REQUESTED = 8; // order cancellation request has been submitted to the smart contract, OS in SC: `cancellation_requested`
    BROKER_ORDER_CANCEL_REQUESTED = 9; // order cancellation request has been submitted to the broker
    BROKER_ORDER_CANCELED = 10; // order has been canceled by the broker, OS in Broker: `canceled`
    
    // Order execution states
    BROKER_ORDER_PARTIALLY_FILLED = 11; // order has been partially filled, OS in Broker: `partially_filled`
    BROKER_ORDER_FILLED = 12; // order has been completely filled, OS in Broker: `filled`
    BROKER_ORDER_EXPIRED = 13; // order has expired, OS in Broker: `expired`
        
    // Order final states
    BROKER_ORACLE_SUBMITTED_FINAL_UPDATE_ORDER = 14; // broker oracle has submitted a final update order request(partial_execution, final_execution, cancellation) to the smart contract
    // updated by TX-listener
    SMART_CONTRACT_ORDER_PARTIALLY_EXECUTED = 15; // order has been partially executed in the smart contract, OS in SC: `partially_executed`
    SMART_CONTRACT_ORDER_EXECUTED = 16; // order has been executed in the smart contract, OS in SC: `executed`
    SMART_CONTRACT_ORDER_CANCELLED = 17; // order has been cancelled in the smart contract, OS in SC: `cancelled`   
}

message Attestation {
    string BrokerQuantity = 1; // Using string to represent Uint128
    string ChainQuantity = 2; // Using string to represent Uint128
    // Note: for the below fields, use int64 instead of uint64 as uint64 not supported in Google Datastore 
    int64 BlockHeight = 3;
    int64 Timestamp = 4;
    int64 ReattestationBlockHeight = 5;
}