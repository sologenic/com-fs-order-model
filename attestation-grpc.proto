syntax = "proto3";

package order;

import "google/protobuf/empty.proto";
import "attestation.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

service AttestationService {
    rpc Create(Attestation) returns (google.protobuf.Empty) {}
    rpc Update(Attestation) returns (google.protobuf.Empty) {}
    rpc Get(AttestationID) returns (Attestation) {}
    rpc List(AttestationQuery) returns (Attestations) {}
}

message AttestationID {
    string Network = 1;
    string SmartContractAddr = 2;
    string Denom = 3;
    optional int64 BlockHeight = 4; // Default will return the latest attestation
}

message AttestationQuery {
    string Network = 1;
    string SmartContractAddr = 2;
    string Denom = 3;
    optional int32 Offset = 5;
}
