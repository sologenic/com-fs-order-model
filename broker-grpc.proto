syntax = "proto3";

package order;

import "google/protobuf/empty.proto";
import "broker.proto";
import "util.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

// Broker Trade Update Log
service BrokerLogService {
  rpc Create(BrokerOrderDetails) returns (Key) {}
  
  // rpc Get(Filter) returns (Records) {}

  // Transaction
  rpc SetLock(LockLogRecord) returns (BrokerOrderDetails) {}

  // For recovery, get all unprocessed Broker Logs. Unprocessed logs are logs that are in the states `OPEN` or `LOCKED`.
  rpc GetAllUnprocessed(google.protobuf.Empty) returns (BrokerOrderDetailsList) {}
  // Starting point for rescanner
  rpc GetLatest(google.protobuf.Empty) returns (BrokerOrderDetails) {}
}
