syntax = "proto3";

package order;

import "google/protobuf/empty.proto";
import "broker.proto";
import "util.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

// Broker Trade Update Log
service BrokerLogService {
  // Non-transaction
  rpc Create(BrokerOrderDetails) returns (Key) {}
  // rpc Get(Filter) returns (Records) {}
  
  // TODO: determine if we will need the Update method -> with the introduction of the LockLogRecord message,
  // we can handle the must have state and target state dynamically. Therefore, we may not need the Update method.
  rpc Update(BrokerOrderDetails) returns (google.protobuf.Empty) {} // Alpaca log line processed into order

  // Transaction
  rpc SetLock(LockLogRecord) returns (BrokerOrderDetails) {}
}
