syntax = "proto3";

package order;

import "google/protobuf/empty.proto";
import "alpaca.proto";

option go_package = "github.com/sologenic/com-fs-order-model;order";

// Alpaca Trade log
service AlpacaService {
    rpc Create(AlpacaOrderDetails) returns (google.protobuf.Empty) {}
  //  rpc Get(Filter) returns (Records) {}
    rpc Update(AlpacaOrderDetails) returns (google.protobuf.Empty) {} // Alpaca log line processed into order
}

