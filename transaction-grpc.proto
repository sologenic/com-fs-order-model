syntax = "proto3";

package transaction;

import "google/protobuf/empty.proto";
import "transaction.proto";

option go_package = "github.com/sologenic/com-fs-transaction-model;transaction";

service TransactionService {
    // Transaction
    rpc UpsertTransaction(Transaction) returns (TransactionID) {}
    rpc GetTransaction(TransactionID) returns (Transaction) {}
    rpc GetTransactions(TransactionQuery) returns (Transactions) {}

    // Order
    rpc UpsertOrder(Order) returns (google.protobuf.Empty) {}
    rpc GetOrder(OrderKey) returns (Order) {}
    rpc GetOrders(OrderQuery) returns (Orders) {}
    rpc UpdateOrderStatusInBroker(UpdateOrderStatusInBrokerRequest) returns (google.protobuf.Empty) {}
}

message TransactionID {
    string TXID = 1;
}

message TransactionQuery {
    string Network = 1;
    optional int32 Offset = 2;
    optional string AssetKey = 3;
    optional string SmartContractAddr = 4;
    optional TransactionType TransactionType = 5;
    optional string Sender = 6;
    // Order detilas
    optional int64 OrderID = 7;
    optional string Creator = 8;
    optional string Denom = 9;
    optional OrderType OrderType = 10;
    optional OrderStateType OrderStateType = 11;
    optional PaymentState PaymentState = 12;
}

message OrderKey {
    string Key = 1;
}

message OrderQuery {
    string Network = 1;
    optional int32 Offset = 2;
    optional string SmartContractAddr = 3;
    optional string AssetKey = 4;
    optional string Creator = 5;
    optional string Denom = 6;
    optional OrderType OrderType = 7;
    optional OrderStateType OrderStateType = 8;
    optional PaymentState PaymentState = 9;
}

message UpdateOrderStatusInBrokerRequest {
    string OrderKey = 1;
    OrderStatusInBroker OrderStatusInBroker = 2;
}
